plugins {
    id "com.android.application"
}

android {
    namespace "com.tauber.nikonlink"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.tauber.nikonlink"
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName "0.8.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDir "../../macos/Resources"
        }
    }
}
