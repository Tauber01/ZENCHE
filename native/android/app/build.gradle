plugins {
    id "com.android.application"
}

android {
    namespace "com.tauber.nikonlink"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.tauber.nikonlink"
        minSdk 26
        targetSdk 35
        versionCode 41
        versionName "1.5.14"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDir "../../macos/Resources"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
