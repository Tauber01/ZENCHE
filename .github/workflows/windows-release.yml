name: Build Windows package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：同时上传到已有 Release，例如 v0.8.1"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download official libusb x64
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "libusb-1.0.29.7z"
          $extractRoot = Join-Path $env:RUNNER_TEMP "libusb-1.0.29"
          Invoke-WebRequest `
            -Uri "https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.7z" `
            -OutFile $archive
          7z x $archive "-o$extractRoot" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the official libusb archive."
          }
          $dll = Join-Path $extractRoot "VS2022\MS64\dll\libusb-1.0.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "Official x64 libusb-1.0.dll was not found."
          }
          "NIKONLINK_LIBUSB_DLL=$dll" >> $env:GITHUB_ENV

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build self-contained Windows x64 packages
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 `
            -Runtime win-x64 `
            -LibUsbDll $env:NIKONLINK_LIBUSB_DLL

      - uses: actions/upload-artifact@v4
        with:
          name: ZENCHE-Windows-x64
          path: |
            dist/ZENCHE-*-Windows-x64-Setup.exe*
            dist/ZENCHE-*-Windows-x64.zip*

      - name: Upload to existing GitHub Release
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG `
            dist/ZENCHE-*-Windows-x64-Setup.exe* `
            dist/ZENCHE-*-Windows-x64.zip* `
            --clobber
