name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-ios.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ZENCHE-iOS-unsigned
          path: dist/ZENCHE-*-ios-unsigned.ipa*

  android:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZENCHE-android
          path: dist/ZENCHE-*-android.apk*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install gphoto2
      - run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZENCHE-macOS
          path: dist/ZENCHE-*-macOS-*.dmg*
