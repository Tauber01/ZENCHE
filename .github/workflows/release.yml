name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    # v1.5.13 uses the locally frozen six release packages whose hashes are
    # recorded in docs/releases/v1.5.13.md. Rebuilding only the macOS-hosted
    # subset here would make the release assets inconsistent.
    if: ${{ github.ref_name != 'v1.5.13' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: brew install gphoto2
      - run: ./scripts/build-all.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          if [[ ! -s "$notes_file" ]]; then
            echo "::error file=$notes_file::缺少详细的简体中文 Release 说明。"
            exit 1
          fi

          assets=()
          for asset in dist/*; do
            [[ -f "$asset" ]] && assets+=("$asset")
          done
          if (( ${#assets[@]} == 0 )); then
            echo "::error::没有可发布的安装包。"
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "帧澈 ZENCHE $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "帧澈 ZENCHE $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi
